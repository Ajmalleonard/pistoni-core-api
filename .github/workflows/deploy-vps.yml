name: pistoni-core-api deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch/tag/sha)"
        required: false
        default: "main"

env:
  GO_VERSION: "1.24.2"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go test
        run: go test ./...

      - name: Build
        run: go build -buildvcs=false -o pistoni-core-api ./cmd/api

  deploy-vps:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR=/home/apps/sq/pistoni-core-api
            BRANCH=${{ github.event.inputs.ref || 'main' }}

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            /usr/local/go/bin/go version
            /usr/local/go/bin/go test ./...
            /usr/local/go/bin/go build -buildvcs=false -o /tmp/pistoni-core-api ./cmd/api
            sudo install -m 755 /tmp/pistoni-core-api /usr/local/bin/pistoni-core-api

            sudo systemctl restart pistoni-core-api
            sleep 3
            sudo systemctl is-active --quiet pistoni-core-api
            curl -fsS --max-time 10 http://127.0.0.1:1012/health

      - name: Post-deploy summary
        run: |
          echo "✅ Deploy completed for ref: ${{ github.event.inputs.ref || github.ref_name }}"
          echo "Remember to keep these repo secrets configured: VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY"

  notify-email:
    if: ${{ always() }}
    needs: [test-and-build, deploy-vps]
    runs-on: ubuntu-latest
    steps:
      - name: Compose notification
        id: compose
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TB="${{ needs.test-and-build.result }}"
          DV="${{ needs.deploy-vps.result }}"

          if [ "$TB" = "success" ] && [ "$DV" = "success" ]; then
            STATUS="SUCCESS"
            REASON="All jobs passed (test-and-build, deploy-vps)."
          else
            STATUS="FAILED"
            REASON="test-and-build=$TB, deploy-vps=$DV"
          fi

          SUBJECT="[${STATUS}] pistoni-core-api deploy (${REF})"
          {
            echo "subject=${SUBJECT}"
            echo "body<<EOF"
            echo "Repository: ${{ github.repository }}"
            echo "Ref: ${REF}"
            echo "Commit: ${{ github.sha }}"
            echo "Status: ${STATUS}"
            echo "Reason: ${REASON}"
            echo "Run URL: ${RUN_URL}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.CI_SMTP_HOST }}
          server_port: ${{ secrets.CI_SMTP_PORT }}
          username: ${{ secrets.CI_SMTP_USER }}
          password: ${{ secrets.CI_SMTP_PASS }}
          secure: true
          subject: ${{ steps.compose.outputs.subject }}
          to: ${{ secrets.CI_NOTIFY_EMAILS }}
          from: ${{ secrets.CI_NOTIFY_FROM }}
          body: ${{ steps.compose.outputs.body }}
